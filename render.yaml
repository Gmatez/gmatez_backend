# Render host. Mock providers are rejected at startup. Enter Twilio, Agora,
# Razorpay, and Firebase secrets in the dashboard (sync: false).
services:
  - type: web
    name: gmatez-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SEED_DEMO
        value: "false"
      - key: OTP_EXPOSE
        value: "false"
      - key: OTP_PROVIDER
        value: sms
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: CALLING_PROVIDER
        value: agora
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: PLATFORM_CURRENCY
        value: INR
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUSH_PROVIDER
        value: fcm
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        value: https://gmatez-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gmatez-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gmatez-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CALLING_WEBHOOK_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true

  - type: keyvalue
    name: gmatez-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: gmatez-db
    plan: free
    region: singapore
    databaseName: social_calling
    user: gmatez
